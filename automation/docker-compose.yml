
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: ai-leadflow-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Africa/Casablanca
      - TZ=Africa/Casablanca
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
